---
  - name: Create yum repositories
    hosts: all
    tasks:
      - name: Create baseos
        ansible.builtin.yum_repository:
          name: BaseOS
          description: BaseOS
          enabled: true
          baseurl: http://192.168.8.150/rhel10/BaseOS
          gpgcheck: true
          gpgkey: http://192.168.8.150/rhel10/RPM-GPG-KEY-redhat-release
          state: present
      - name: Create AppStream
        ansible.builtin.yum_repository:
          name: AppStream
          description: AppStream
          enabled: true
          baseurl: http://192.168.8.150/rhel10/AppStream
          gpgcheck: true
          gpgkey: http://192.168.8.150/rhel10/RPM-GPG-KEY-redhat-release
          state: present 