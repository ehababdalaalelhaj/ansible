---
- name: Install httpd
  hosts: web
  vars:
    my_services:
      - httpd
      - firewalld
  tasks:
    - name: Install Services
      ansible.builtin.dnf:
        name: "{{ my_services }}"
        state: present
    - name: Enable and start firewalld
      ansible.builtin.service:
        name: firewalld
        enabled: true
        state: started
    - name: Enable and start httpd
      ansible.builtin.service:
        name: httpd
        enabled: true
        state: started
    - name: Configure firewall for httpd
      ansible.posix.firewalld:
        service: http
        state: enabled
        permanent: true
        immediate: true
